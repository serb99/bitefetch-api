info:
  name: invalid vehicle
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/signup/courier"
  body:
    type: json
    data: |-
      {
        "email": "{{courierEmail2}}",
        "password": "{{testPassword}}",
        "fullName": "Test Courier",
        "phone": "+40 712 345 681",
        "vehicleType": "truck"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("courierEmail2", `\courier+${Date.now()}@example.com`);
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.error.code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.error.details.length
      operator: eq
      value: "1"
    - expression: res.body.error.details[0].field
      operator: eq
      value: vehicleType

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
