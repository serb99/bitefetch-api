info:
  name: missing phone
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/signup/courier"
  body:
    type: json
    data: |-
      {
        "email": "{{courierEmail2}}",
        "password": "{{testPassword}}",
        "fullName": "Test Courier",
        "vehicleType": "bike"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.error.details.length
      operator: eq
      value: "1"
    - expression: res.body.error.details[0].field
      operator: eq
      value: phone

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
