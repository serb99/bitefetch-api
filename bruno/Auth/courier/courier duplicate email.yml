info:
  name: courier duplicate email
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/signup/courier"
  body:
    type: json
    data: |-
      {
        "email": "{{courierEmail}}",
        "password": "{{testPassword}}",
        "fullName": "Test Courier",
        "phone": "+40 712 345 681",
        "vehicleType": "bike"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.body.error.code
      operator: eq
      value: EMAIL_TAKEN

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
