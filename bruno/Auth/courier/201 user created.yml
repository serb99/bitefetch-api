info:
  name: 201 user created
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/signup/courier"
  body:
    type: json
    data: |-
      {
        "email": "{{courierEmail}}",
        "password": "{{testPassword}}",
        "fullName": "Test Courier",
        "phone": "+40 712 345 681",
        "vehicleType": "bike"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("courierEmail", `\courier+${Date.now()}@example.com`);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.user.email
      operator: eq
      value: "{{courierEmail}}"
    - expression: res.body.user.password_hash
      operator: isUndefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
