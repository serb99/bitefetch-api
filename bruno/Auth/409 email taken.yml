info:
  name: 409 email taken
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/signup"
  body:
    type: json
    data: |-
      {
        "email": "{{testEmail}}",
        "password": "supersecret123",
        "fullName": "Test Customer",
        "phone": "+40 712 345 678"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.body.error.code
      operator: eq
      value: EMAIL_TAKEN

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
