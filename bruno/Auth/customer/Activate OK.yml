info:
  name: Activate OK
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/activate"
  body:
    type: json
    data: '{"token": "{{activationToken}}"}'
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.message
      operator: eq
      value: Account activated

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
