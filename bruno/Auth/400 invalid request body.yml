info:
  name: 400 invalid request body
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/signup"
  body:
    type: json
    data: '{ "email": "not-an-email", "password": "123", "fullName": "" }'
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.error.code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.error.details.length
      operator: eq
      value: "3"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
