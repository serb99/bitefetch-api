info:
  name: Malformed JSON
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/anything"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{bad"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.error.code
      operator: eq
      value: INVALID_JSON
    - expression: "res.body.error.message "
      operator: eq
      value: Request body is not valid JSON
    - expression: res.headers['x-request-id']
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
