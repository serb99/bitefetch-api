info:
  name: Valid JSON unknown route
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/anything"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.error.code
      operator: eq
      value: NOT_FOUND

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
