info:
  name: 404 route not found
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/orderz"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.error.code
      operator: eq
      value: NOT_FOUND
    - expression: res.headers['x-request-id']
      operator: isString
    - expression: res.headers['x-request-id']
      operator: length
      value: "36"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
